<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задача 6</title>
</head>
<body>
    <h1>Задача 6</h1>
    <p>З клавіатури вводяться вартість товару та кількість одиниць 3 товарів. <br> 
        Обчислити вартість кожного товару окремо та загальну вартість. <br>
        Вивести чек (як у супермаркеті) використовуючи елементи розмітки.</p>
    <script>
        //Вводимо необхідні дані
        let price1 = Number(prompt('Введіть ціну першого товару', 0));              // Ціна першого товару
        let quantity1 = parseInt(prompt('Введіть кількість першого товару', 0));    // Кількість першого товару

        let price2 = Number(prompt('Введіть ціну другого товару', 0));              // Ціна другого товару
        let quantity2 = parseInt(prompt('Введіть кількість другого товару', 0));    // Кількість другого товару


        let price3 = Number(prompt('Введіть ціну тетього товару', 0));               // Ціна третього товару
        let quantity3 = parseInt(prompt('Введіть кількість третього товару', 0));    // Кількість третього товару




        
        // Знаходимо результат
        let total1 = price1 * quantity1;                                              // Вартість першого товару
        let total2 = price2 * quantity2;                                              // Вартість другого товару
        let total3 = price3 * quantity3;                                              // Вартість третього товару
        let grandTotal = total1 + total2 + total3;                                    // Загальна сума чека

        //Виводимо результат
        document.write(`
            <table border="1" style="text-align: center;">
                <tr>
                    <th>Товар</th>
                    <th>Ціна</th>
                    <th>Кількість</th>
                    <th>Вартість</th>
                </tr>
                <tr>
                    <td>Товар 1</td>
                    <td>${price1.toFixed(2)}</td>
                    <td>${quantity1}</td>
                    <td>${total1.toFixed(2)}</td>
                </tr>
                <tr>
                    <td>Товар 2</td>
                    <td>${price2.toFixed(2)}</td>
                    <td>${quantity2}</td>
                    <td>${total2.toFixed(2)}</td>
                </tr>
                <tr>
                    <td>Товар 3</td>
                    <td>${price3.toFixed(2)}</td>
                    <td>${quantity3}</td>
                    <td>${total3.toFixed(2)}</td>
                </tr>
                <tr>
                    <td colspan="3">Загальна сума чека</td>
                    <td>${grandTotal.toFixed(2)}</td>
                </tr>
            </table>
            `)
    </script>
    
</body>
</html>
