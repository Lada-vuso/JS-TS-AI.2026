<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задача 3</title>
</head>
<body>
    <h1>Задача 3</h1>
    <p>Дано вартість одиниці товару і кількість. Знайти загальну вартість та ПДВ (5% від загальної вартості).</p>
    <script>
        //Вводимо необхідні дані
        let unitPrice = Number(prompt('Введіть ціну одиниці товару', 0));    // Ціна одиниці товару
        let quantity = parseInt(prompt('Введіть кількість товару', 0));      // Кількість товару
        const vat = 0.05;                                                    // Ставка ПДВ — 5%
        
        // Знаходимо результат
        let totalPrice = unitPrice * quantity;                               // Загальна вартість
        let vatAmount = totalPrice * vat ;                                   // Сума ПДВ

        //Виводимо результат
        document.write(`Загальна вартість складає ${totalPrice.toFixed(2)} грн. <br>
                        Сума ПДВ складає ${vatAmount.toFixed(2)} грн`);
    </script>
    
</body>
</html>
