<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задача 2</title>
</head>
<body>
    <h1>Задача 2</h1>
    <p>Дано рік народження (дата: 1 січня) та поточний рік. Знайти кількість років.</p>
    <script>
        //Вводимо необхідні дані
        let birthYear = Number(prompt('Введіть рік народження, в форматі ****', 0));
        let currentYear = Number(prompt('Введіть поточний рік, в форматі ****', 0));

        // Знаходимо результат
        let age = currentYear - birthYear;

        //Виводимо результат
        document.write(`Вік складає ${age}`);
    </script>
    
</body>
</html>
