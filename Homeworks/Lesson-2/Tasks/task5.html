<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задача 5</title>
</head>
<body>
    <h1>Задача 5</h1>
    <p>Дано кількість секунд, що пройшла від початку доби. Визначити скільки це годин і хвилин.</p>
    <script>
        //Вводимо необхідні дані
        let totalSeconds = Number(prompt('Введіть кількість секунд, що пройшла від початку доби.', 0));  // Кількість секунд
                
        // Знаходимо результат
        let hours = parseInt(totalSeconds / 3600);                                        // Кількість повних годин
        let minutes = (totalSeconds - (hours * 3600))/60 ;                                // Кількість залишкових хвилин

        //Виводимо результат
        document.write(`Від початку доби пройшло ${hours} годин і ${Math.floor(minutes)} хвилин`);
    </script>
    
</body>
</html>
