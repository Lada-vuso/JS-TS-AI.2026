<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Екстра-задача 10</title>
</head>
<body>
    <h1>Екстра-задача 10</h1>
    <p>З клавіатури вводиться кількість монет номіналом 1 копійка.<br>
        Визначити скільки гривень і копійок є у даній сумі. <br>
        Наприклад, дано 245 копійок, а вивести 2 грн 45 копійок.
    </p>
    <script>
        //Вводимо необхідні дані
        let coinCount = Number(prompt('Введіть кількість монет по 1 коп.', 0));  // Кількість монет по 1 копійці
                
        // Знаходимо результат
        let remainingKopecks = coinCount % 100;                          // Кількість копійок, що залишилися
        let hryvnias = (coinCount - remainingKopecks) / 100;             // Кількість повних гривень
    

        //Виводимо результат
        document.write(`${coinCount} монет по 1 копійці складає ${hryvnias} грн. і ${remainingKopecks} коп.`);
    </script>
    
</body>
</html>
