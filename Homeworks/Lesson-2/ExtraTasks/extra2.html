<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Екстра-задача 2</title>
</head>
<body>
    <h1>Екстра-задача 2</h1>
    <p>
        З клавіатури вводиться розмір заробітної плати та розмір прожиткового мінімуму. <br>
        Визначити розмір соціальної допомоги (ввжаємо, що заробітна плата є меншою).
    </p>
    <script>
        //1.Вводимо необхідні дані
        let salary = Number(prompt('Введіть розмір заробітної плати, в грн.', "0.00"));               // Заробітна плата
        let livingMinimum = Number(prompt('Введіть розмір прожиткового мінімуму, в грн.', "0.00"));;  // Прожитковий мінімум
        

        // Знаходимо результат
        let socialAssistance = livingMinimum - salary;                                              // Розмір соціальної допомоги

        //Виводимо результат
        document.write ("Розмір соціальної допомоги складе "+ socialAssistance.toFixed(2) + " грн.");        
    </script>
    
</body>
</html>
