<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задача 3</title>
</head>
<body>
    <h1>Задача 3</h1>
    <p>Створити окремі функції, які для 4 чисел знаходять: <br>
                1.суму; <br>
                2.добуток; <br>
                3.середнє арифметичне; <br>
                4.мінімальне значення. 
    </p>
    <script>
        if (confirm("Почати тестування?")) {
            //Вводимо необхідні дані
            let num1 = Number ( prompt ("Введіть перше число", 0))
            let num2 = Number ( prompt ("Введіть друге число", 0))
            let num3 = Number ( prompt ("Введіть третє число", 0))
            let num4 = Number ( prompt ("Введіть четверте число", 0))
            
            // Обробка даних
            function getSum(num1, num2, num3, num4){
                return num1 + num2 + num3 + num4
            }

            function getProduct(num1, num2, num3, num4){
                return num1 * num2 * num3 * num4
            }

            function getAverage(num1, num2, num3, num4){
                return (num1 + num2 + num3 + num4)/4
            }

            function getMin(num1, num2, num3, num4){
                let min = num1
                if (num2 < min) {
                    min = num2
                } 
                if (num3 < min) {
                    min = num3
                } 
                if (num4 < min) {
                    min = num4
                } return min
            }

            // Виводимо результат
            document.write(`Цифри ${num1}, ${num2}, ${num3}, ${num4}<br>`)
            document.write(`Сума = ${getSum(num1, num2, num3, num4)}<br>`)
            document.write(`Добуток = ${getProduct(num1, num2, num3, num4)}<br>`) 
            document.write(`Середнє арифметичне = ${getAverage(num1, num2, num3, num4)}<br>`) 
            document.write(`Мінімальне значення = ${getMin(num1, num2, num3, num4)}<br>`) 
        }
    </script>    
</body>
</html>
