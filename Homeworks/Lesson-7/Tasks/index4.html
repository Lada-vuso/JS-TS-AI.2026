<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задача 4</title>
</head>
<body>
    <h1>Задача 4</h1>
    <p>Створити функцію, яка для 3 заданих чисел знаходить одночасно декілька результатів: <br>
        кількість парних, кількість додатних, кількість більших за 100. 
    </p>
    <script>
        if (confirm("Почати тестування?")) {
            //Вводимо необхідні дані
            let num1 = Number ( prompt ("Введіть перше число", 0))
            let num2 = Number ( prompt ("Введіть друге число", 0))
            let num3 = Number ( prompt ("Введіть третє число", 0))           

            
            // Обробка даних
            function analyzeNumbers(num1, num2, num3){
                let evenCount = 0	                                 // Кількість парних
                if (num1 % 2 === 0) evenCount++
                if (num2 % 2 === 0) evenCount++
                if (num3 % 2 === 0) evenCount++

                let positiveCount = 0	                             // Кількість додатних        
                if (num1 > 0) positiveCount++
                if (num2 > 0) positiveCount++
                if (num3 > 0) positiveCount++
            
                let over100Count = 0	                             // Кількість більших за 100
                if (num1 > 100) over100Count++
                if (num2 > 100) over100Count++
                if (num3 > 100) over100Count++    
                
                document.write (`Кількість парних ${evenCount}<br>
                                Кількість додатних ${positiveCount}<br>
                                Кількість більших за 100  ${over100Count}`
                    )                
            }

            // Виводимо результат
            analyzeNumbers(num1, num2, num3)        
        }
    </script>
</body>
</html>
