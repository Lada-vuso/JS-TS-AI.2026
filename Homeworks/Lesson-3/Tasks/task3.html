<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задача 3</title>
</head>
<body>
    <h1>Задача 3</h1>
    <p>Випадковим чином генерується число від 1 до 5.<br>
        Спробуйте вгадати число за 2 спроби.
    </p>
    <script>
        //Вводимо необхідні дані
        let secretNumber = Math.floor(Math.random() * 5) + 1;   // Загадане випадкове число
        let firstGuess = Number(prompt('Введіть число (перша спроба)', 0));     // Перша спроба користувача
        

        // Знаходимо результат і виводимо результат
        if (firstGuess === secretNumber) {
            document.write(`Вгадав, число ${secretNumber}`);
        } else {
            alert("Не вгадав, давай ще раз");
            let secondGuess = Number(prompt('Введіть число (друга спроба)', 0));    // Друга спроба користувача
            if (secondGuess === secretNumber) {
            document.write(`Вгадав, число ${secretNumber}`);
            }
            else {
            document.write(`Cоррі, ні, і другий раз ні :(`);
        }}
        
    </script>
    
</body>
</html>
