<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задача 3</title>
</head>
<body>
    <h1>Задача 3</h1>
    <p>Дано масив імен учнів. З’ясувати скільки разів зустрічається ім’я «Іван».
    </p>
    <script>
        if (confirm("Почати тестування?")) {
            //Вводимо необхідні дані
            let names = ["Іван", "Олена", "Петро", "Іван", "Марія", "Іван"]
            let ivanCount = 0
            
            // Обробка даних
            for (let index = 0; index < names.length; index++) {
                if (names[index] === "Іван"){ 
                    ivanCount++
                }                
            }

            // Виводимо результат
            document.write(`Ім'я Іван зустрічається ${ivanCount} раз/разів`) 
        }
    </script>    
</body>
</html>
