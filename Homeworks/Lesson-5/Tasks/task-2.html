<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задача -2</title>
</head>
<body>
    <h1>Задача -2</h1>
    <p>Поступово генерувати 100 випадкових чисел від 1 до 1000. <br>
        Підрахувати яких чисел більше: парних чи непарних.
    </p>
    <script>
        if (confirm("Почати тестування?")) {
        //Вводимо необхідні дані
        let evenCount = 0
        let oddCount = 0
        let randomNumber
        let resultMessage

        // Знаходимо результат і виводимо результат
        for (let i = 1; i <= 100; i++) {
            randomNumber = 1 + Math.floor(Math.random()*1000)
            if (randomNumber % 2 === 0) {
                evenCount ++
            } else {
                oddCount ++
            }
        }

        if (evenCount > oddCount) {
            resultMessage = "парних більше"
        } else if (evenCount < oddCount) {
            resultMessage = "непарних більше"
        } else {
            resultMessage = "парних і непарних однаково"
        }

        document.write (`Результат порівняння виявив, що ${resultMessage} <br>
                        Парних: ${evenCount}, непарних: ${oddCount}.`)
        }
    </script>
    
</body>
</html>
