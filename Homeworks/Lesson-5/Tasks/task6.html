<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задача 6</title>
</head>
<body>
    <h1>Задача 6</h1>
    <p>Вивести 3 таблиці (по 3 рядки і 3 стовпці у кожній) за зразком
    </p>
    <script>
        if (confirm("Почати тестування?")) {
        //Вводимо необхідні дані
        let cellNumber = 0         

        for (let table = 0; table < 3; table++) {                                                             // Цикл таблиць
            document.write("<table border='2' style='display: inline-table; vertical-align: top; margin-right: 10px'>")
            for (let row = 1; row <= 3; row++) {                                                              // Зовнішній цикл — рядки
                document.write("<tr>")
                    for (let col = 1; col <= 3; col++) {
                    cellNumber = cellNumber + 1                                                               // Внутрішній цикл — клітинки
                    document.write(`<td>${cellNumber}</td>`)        
                    }
                document.write("</tr>")
            }
            document.write("</table>")
        }

        
        }
    </script>    
</body>
</html>
